<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Name to Desmos</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script
      src="https://www.desmos.com/api/v1.7/calculator.js?apiKey=desmos"
      defer
    ></script>
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1>Name to Desmos</h1>
        <p>Type your name, then graph it as Desmos equations.</p>
      </header>
      <section class="controls">
        <label class="input-label" for="nameInput">Your name</label>
        <div class="input-row">
          <input id="nameInput" type="text" placeholder="Ada Lovelace" />
          <button id="plotButton" type="button">Plot on Desmos</button>
        </div>
        <p class="hint">Short names plot fastest.</p>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>
      <section class="graph">
        <div id="calculator" class="calculator"></div>
      </section>
    </main>
  </body>
</html>
